# Local development dependencies. The API itself runs on the host with `go run ./cmd/api`.
name: titipdong

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: titipdong
      POSTGRES_PASSWORD: titipdong
      POSTGRES_DB: titipdong
    ports:
      # Override with POSTGRES_PORT=5433 if another PostgreSQL already uses 5432,
      # and update DATABASE_URL in .env.local to match.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titipdong -d titipdong"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
