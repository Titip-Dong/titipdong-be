# Local all-Docker development: PostgreSQL and the API run in containers.
name: titipdong

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-titipdong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-titipdong-dev}
      POSTGRES_DB: ${POSTGRES_DB:-titipdong}
    ports:
      # Override with POSTGRES_PORT=5433 if another PostgreSQL already uses 5432,
      # and update DATABASE_URL in .env.local to match.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titipdong -d titipdong"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
    image: titipdong-api:local
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-titipdong}:${POSTGRES_PASSWORD:-titipdong-dev}@postgres:5432/${POSTGRES_DB:-titipdong}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: ""
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-fake}
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      BLOB_CONTAINER: uploads
      # Browsers reach Azurite on the host port, not the Docker hostname.
      BLOB_PUBLIC_URL: http://localhost:10000
    ports:
      - "8080:8080"
    healthcheck:
      # Fiber listens on IPv4 in this image; localhost may resolve to ::1.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Local Azure Blob Storage emulator; the account key is Azurite's public development key.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--location", "/data", "--loose"]
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

volumes:
  postgres-data:
  azurite-data:
