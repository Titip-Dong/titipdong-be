version: "2"
sql:
  # All queries live in db/queries/ and generate one shared package, so any query
  # can JOIN any table and every feature uses the same model types.
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: date
            go_type: time.Time
