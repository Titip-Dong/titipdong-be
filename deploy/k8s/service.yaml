apiVersion: v1
kind: Service
metadata:
  name: titipdong-api
  namespace: titipdong
  labels:
    app.kubernetes.io/name: titipdong-api
    app.kubernetes.io/part-of: titipdong
spec:
  # Prototype public endpoint for local monitoring and smoke tests. Add HTTPS
  # ingress before pointing the Azure Static Web App at this API.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: titipdong-api
  ports:
    - name: http
      port: 80
      targetPort: http
