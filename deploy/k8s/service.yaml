apiVersion: v1
kind: Service
metadata:
  name: titipdong-api
  namespace: titipdong
  labels:
    app.kubernetes.io/name: titipdong-api
    app.kubernetes.io/part-of: titipdong
spec:
  # Internal only; Caddy (caddy.yaml) is the public HTTPS entry point.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: titipdong-api
  ports:
    - name: http
      port: 80
      targetPort: http
