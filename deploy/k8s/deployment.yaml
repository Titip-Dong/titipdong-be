apiVersion: apps/v1
kind: Deployment
metadata:
  name: titipdong-api
  namespace: titipdong
  labels:
    app.kubernetes.io/name: titipdong-api
    app.kubernetes.io/part-of: titipdong
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: titipdong-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: titipdong-api
        app.kubernetes.io/part-of: titipdong
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        # Preferred, not required: spread pods when there are several nodes, but still run both on a single-node cluster.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: titipdong-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: titipdongacr20261023.azurecr.io/titipdong-api:manual
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: titipdong-api-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: titipdong-api-secrets
                  key: JWT_SECRET
            # Uploads stay disabled until this key exists in the Secret.
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: titipdong-api-secrets
                  key: AZURE_STORAGE_CONNECTION_STRING
                  optional: true
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: titipdong-api-config
                  key: CORS_ORIGINS
                  optional: true
            - name: PAYMENT_GATEWAY
              value: fake
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          lifecycle:
            preStop:
              exec:
                # Let the Service stop routing to this pod before shutdown starts.
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
