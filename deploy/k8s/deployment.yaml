apiVersion: apps/v1
kind: Deployment
metadata:
  name: titipdong-api
  namespace: titipdong
  labels:
    app.kubernetes.io/name: titipdong-api
    app.kubernetes.io/part-of: titipdong
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: titipdong-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: titipdong-api
        app.kubernetes.io/part-of: titipdong
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: titipdong-api
              topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: titipdongacr2026.azurecr.io/titipdong-api:manual
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: titipdong-api-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: titipdong-api-secrets
                  key: JWT_SECRET
          lifecycle:
            preStop:
              exec:
                # Let the Service stop routing to this pod before shutdown starts.
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
