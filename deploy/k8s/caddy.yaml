# HTTPS entry point for the API: Caddy terminates TLS with a Let's Encrypt certificate for the Azure DNS name of
# its public IP and proxies to the titipdong-api Service. Certificates live on a disk so restarts do not re-issue
# them (Let's Encrypt rate-limits duplicate certificates).
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: titipdong
  labels:
    app.kubernetes.io/name: caddy
    app.kubernetes.io/part-of: titipdong
data:
  Caddyfile: |
    titipdong-api.indonesiacentral.cloudapp.azure.com {
      encode gzip
      reverse_proxy titipdong-api:80
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
  namespace: titipdong
  labels:
    app.kubernetes.io/name: caddy
    app.kubernetes.io/part-of: titipdong
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: titipdong
  labels:
    app.kubernetes.io/name: caddy
    app.kubernetes.io/part-of: titipdong
spec:
  replicas: 1
  # The data disk attaches to one pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy
        app.kubernetes.io/part-of: titipdong
    spec:
      containers:
        - name: caddy
          image: caddy:2.11.7-alpine
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: caddy-config
        - name: data
          persistentVolumeClaim:
            claimName: caddy-data
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: titipdong
  labels:
    app.kubernetes.io/name: caddy
    app.kubernetes.io/part-of: titipdong
  annotations:
    # Gives the public IP the name titipdong-api.indonesiacentral.cloudapp.azure.com.
    service.beta.kubernetes.io/azure-dns-label-name: titipdong-api
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: caddy
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
