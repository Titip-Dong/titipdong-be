name: Check

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: titipdong
          POSTGRES_PASSWORD: titipdong-ci
          POSTGRES_DB: titipdong
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U titipdong -d titipdong"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.37.0
        ports:
          - 10000:10000

    env:
      TEST_DATABASE_URL: postgres://titipdong:titipdong-ci@127.0.0.1:5432/titipdong?sslmode=disable
      # Azurite's public development account key.
      TEST_AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format, vet, lint, sqlc drift, unit tests
        run: make check

      - name: Integration tests
        run: go test ./... -count=1 -race

      - name: Export OpenAPI spec
        run: make openapi

      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
